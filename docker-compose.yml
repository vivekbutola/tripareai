version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tripare-mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hotel_booking_db
      MYSQL_USER: tripare
      MYSQL_PASSWORD: tripare123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
